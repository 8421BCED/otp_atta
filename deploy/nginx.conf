# AttendOTP behind nginx: TLS, load balancing, rate limiting.
# Copy to /etc/nginx/sites-available/otpattendance and enable it.
#
# Load balancing has two layers:
#   1. PM2 cluster mode spreads requests over every CPU core on one server.
#   2. This upstream spreads requests over several servers. Add one "server" line per machine
#      (each runs the same app, all pointing at the same MySQL).
# The app keeps no session in memory (JWT tokens, data in MySQL), so any server can answer any request.

# A whole campus shares one public address, so limits follow the signed-in USER, not the address.
# The key is the last 40 characters of the bearer token (its signature, unique per session).
# Requests with no token (the sign-in page) fall back to the address.
map $http_authorization $limit_key {
    ~(?<tail>[A-Za-z0-9_-]{40})$  $tail;
    default                       $binary_remote_addr;
}
limit_req_zone $limit_key          zone=api:20m   rate=300r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=anon:10m  rate=6000r/m;

upstream attendotp {
    least_conn;
    keepalive 64;

    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    # server 10.0.0.12:5000 max_fails=3 fail_timeout=10s;
    # server 10.0.0.13:5000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name otpattendance.fxcams.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name otpattendance.fxcams.in;

    ssl_certificate     /etc/letsencrypt/live/otpattendance.fxcams.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otpattendance.fxcams.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;       # headcount photos
    proxy_read_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sign-in: Google sign-ins from one campus address arrive in bursts each morning.
    location ~ ^/api/auth/(login|google)$ {
        limit_req zone=login burst=200 nodelay;
        proxy_pass http://attendotp;
    }

    # Tiny public calls the app makes when it opens (clock, sign-in options, push key). 2,500 students
    # open the app within minutes from one campus address, so these get their own generous allowance.
    # The service worker has no sign-in, so its receipts and key renewals come here too.
    location ~ ^/api/(time|auth/config|notifications/(public-key|ack|resubscribe))$ {
        limit_req zone=anon burst=3000 nodelay;
        proxy_pass http://attendotp;
    }

    location /api/ {
        limit_req zone=api burst=150 nodelay;
        proxy_pass http://attendotp;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Built app. Hashed files are cached for a year by the app itself.
    location / {
        proxy_pass http://attendotp;
    }
}

